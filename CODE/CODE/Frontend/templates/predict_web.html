<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic Meta Tags -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <!-- Site Metas -->
  <meta name="keywords" content="Traffic Safety, Helmet Detection, Triple Riding, Carint" />
  <meta name="description" content="Carint: A deep learning system for detecting helmet violations and triple riding." />
  <meta name="author" content="Carint" />
  <link rel="shortcut icon" href="/static/images/fevicon.png" type="">

  <title>Carint</title>

  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.css" />

  <!-- Fonts Style -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (Latest for traffic icons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

  <!-- Animate.css for animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Custom styles for this template -->
  <link href="/static/css/style.css" rel="stylesheet" />
  <!-- Responsive style -->
  <link href="/static/css/responsive.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    }

    .hero_area {
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .header_section {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 15px 0;
    }

    .navbar-nav .nav-link {
      display: flex;
      align-items: center;
      color: #333;
      font-weight: 500;
      padding: 12px 25px;
      transition: all 0.3s ease;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background-color: black;
      padding: 20px;
      border-radius: 8px;
    }

    video {
      width: 100%;
      border: 2px solid #fff;
    }

    #predictionMessage {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #ff5722;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 5px;
    }

    .btn-box {
      text-align: center;
      margin-top: 20px;
    }

    .btn-box .btn {
      background-color: #1a73e8;
      color: #fff;
      padding: 14px 35px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.4s ease;
    }

    .btn-box .btn:hover {
      background-color: #ff5722;
      transform: translateY(-5px);
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <!-- Header Section -->
    <header class="header_section">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="#">
          <i class="fas fa-motorcycle"></i> Carint: Traffic Safety AI
        </a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link" href="{{ url_for('home') }}">
                <i class="fas fa-road"></i> Home
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link" href="{{ url_for('upload') }}">
                <i class="fas fa-upload"></i> Upload
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link" href="{{ url_for('video_feed') }}">
                <i class="fas fa-upload"></i> Prediction
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('logout') }}">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <!-- End Header Section -->

    <!-- Webcam Video Section -->
    <section class="webcam_section">
      <div class="container">
        <div class="row">
          <div class="col-md-8">
            <div class="video-container" id="videoContainer">
              <img id="videoElement" width="100%" style="border:2px solid white; border-radius:10px;">
              <div id="predictionMessage">Waiting for detection...</div>
            </div>
            <div class="btn-box">
              <a href="javascript:void(0);" onclick="startWebcam()" class="btn">Start Webcam Detection</a>
              <br><br>
              <a href="javascript:void(0);" onclick="stopWebcam()" class="btn">Stop Webcam</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- jQuery -->
  <script type="text/javascript" src="/static/js/jquery-3.4.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script type="text/javascript" src="/static/js/bootstrap.js"></script>

<script>
  function startWebcam() {
    const videoElement = document.getElementById('videoElement');
    videoElement.src = "{{ url_for('video_feed') }}";
    document.getElementById('predictionMessage').textContent = "🚨 Detecting violations...";
  }

  function stopWebcam() {
    const videoElement = document.getElementById('videoElement');
    videoElement.src = "";
    document.getElementById('predictionMessage').textContent = "⛔ Stopped";
  }
</script>

  

</body>

</html>
