<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <link rel="shortcut icon" href="/static/images/fevicon.png" type="">

  <title>Carint</title>

  <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link href="/static/css/style.css" rel="stylesheet" />
  <link href="/static/css/responsive.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    }

    .hero_area {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .header_section {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 15px 0;
    }

    .header_bottom .navbar-brand {
      display: flex;
      align-items: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a73e8;
      text-transform: uppercase;
    }

    .navbar-brand i {
      margin-right: 15px;
      font-size: 2.2rem;
      color: #1a73e8;
    }

    .navbar-nav .nav-link {
      display: flex;
      align-items: center;
      color: #333;
      font-weight: 500;
      padding: 12px 25px;
    }

    .navbar-nav .nav-link i {
      margin-right: 10px;
      color: #1a73e8;
    }

    .hero_content {
      padding: 120px 0 90px;
    }

    .hero_card {
      padding: 48px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .hero_card h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1f2d3d;
      margin-bottom: 18px;
    }

    .hero_card p {
      font-size: 1.1rem;
      color: #334e68;
      margin-bottom: 28px;
    }

    .hero_actions a {
      margin-right: 12px;
      margin-bottom: 12px;
    }

    .btn-main {
      background: #1a73e8;
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      display: inline-block;
      font-weight: 600;
    }

    .btn-alt {
      background: #ff5722;
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      display: inline-block;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="hero_area">
    <header class="header_section">
      <div class="header_bottom">
        <div class="container-fluid">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
              <i class="fas fa-traffic-light"></i>
              Carint: Traffic Safety AI
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class=""> </span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav">
                <li class="nav-item active">
                  <a class="nav-link" href="{{ url_for('index') }}"><i class="fas fa-road"></i> Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('about') }}"><i class="fas fa-info-circle"></i> About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('login') }}"><i class="fas fa-user-lock"></i> Login</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </header>

    <section class="hero_content">
      <div class="container">
        <div class="hero_card">
          <h1>AI-powered traffic violation detection for safer roads</h1>
          <p>
            Upload images, monitor live camera feeds, and review detection history for helmet violations,
            triple riding, phone usage while riding, and wheeling.
          </p>
          <div class="hero_actions">
            <a class="btn-main" href="{{ url_for('login') }}">Login</a>
            <a class="btn-alt" href="{{ url_for('register') }}">Register</a>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/js/jquery-3.4.1.min.js"></script>
  <script src="/static/js/bootstrap.js"></script>
</body>

</html>
